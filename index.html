<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Kosugi Maru', sans-serif;
  background:#f7f7fb;
  margin:0;
  text-align:center;
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  padding:10px;
}

.day{
  background:white;
  border-radius:10px;
  padding:5px;
}

.sunday{color:#ff6b6b;}
.saturday{color:#4dabf7;}
.holiday{color:#ff3b3b;font-weight:bold;}
.today{background:#ffe066;}

.event{font-size:10px;}

#popup{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  top:0;
  left:0;
  justify-content:center;
  align-items:center;
}

#popupContent{
  background:white;
  padding:20px;
  border-radius:10px;
  width:80%;
}
</style>
</head>

<body>

<h2 id="title"></h2>
<div id="calendar"></div>

<div id="popup" onclick="closePopup(event)">
  <div id="popupContent"></div>
</div>

<script>
let date = new Date();
let holidays = {};

async function loadHolidays(year){
  const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
  holidays = await res.json();
}

const events = {
  "2-14":"バレンタイン",
  "12-25":"クリスマス"
};

async function renderCalendar(){
  const year = date.getFullYear();
  const month = date.getMonth();

  await loadHolidays(year);

  document.getElementById("title").textContent =
    year+"年 "+(month+1)+"月";

  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const firstDay = new Date(year,month,1).getDay();
  const lastDate = new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++) cal.innerHTML += "<div></div>";

  for(let d=1; d<=lastDate; d++){
    const el = document.createElement("div");
    el.className="day";

    const dow = new Date(year,month,d).getDay();
    if(dow===0) el.classList.add("sunday");
    if(dow===6) el.classList.add("saturday");

    const dateStr =
      year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");

    const holiday = holidays[dateStr] || "";
    if(holiday) el.classList.add("holiday");

    const key = (month+1)+"-"+d;

    el.innerHTML = `
      <div>${d}</div>
      <div class="event">
        ${holiday}
        ${events[key] ? "<br>"+events[key] : ""}
      </div>
    `;

    el.onclick = () => openPopup(year,month,d,holiday);

    cal.appendChild(el);
  }
}

function openPopup(year,month,day,holiday){
  const key=(month+1)+"-"+day;
  const saved=localStorage.getItem(key)||"";

  document.getElementById("popupContent").innerHTML=`
    <h3>${month+1}月${day}日</h3>
    ${holiday ? "<p>"+holiday+"</p>" : ""}
    ${events[key] ? "<p>"+events[key]+"</p>" : ""}
    <textarea id="memo">${saved}</textarea><br>
    <button onclick="saveMemo('${key}')">保存</button>
  `;

  popup.style.display="flex";
}

function closePopup(e){
  if(e.target.id==="popup") popup.style.display="none";
}

function saveMemo(key){
  localStorage.setItem(key, document.getElementById("memo").value);
  alert("保存😏");
}

renderCalendar();
</script>

</body>
</html>
